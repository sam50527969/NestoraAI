name: Backend Tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend API and authentication tests
    runs-on: ubuntu-latest

    env:
      AUTH_SECRET_KEY: nestora-ci-auth-secret-not-for-production
      AUTH_ACCESS_TOKEN_MINUTES: "60"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Run backend tests
        run: |
          python -m pytest -q
