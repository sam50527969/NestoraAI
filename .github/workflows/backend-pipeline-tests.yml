name: Backend Tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend API and authentication tests
    runs-on: ubuntu-latest

    env:
      AUTH_SECRET_KEY: nestora-ci-auth-secret-not-for-production
      AUTH_ACCESS_TOKEN_MINUTES: "60"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run backend tests
        run: |
          python -m pytest \
            test_pipeline_synchronization.py \
            test_pipeline_workflows.py \
            test_crm_api.py \
            test_follow_up_api.py \
            test_outreach_api.py \
            test_ceo_approvals_api.py \
            test_search_api.py \
            test_outreach_generation_api.py \
            test_sales_ai_api.py \
            test_website_api.py \
            test_mission_api.py \
            test_mission_events_api.py \
            test_dashboard_api.py \
            test_auth_api.py \
            test_route_protection.py \
            test_realtime_auth.py \
            -v
