services:
  - type: web
    name: nestora-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python start_production.py
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: nestora-postgres
          property: connectionString

      - key: AUTH_SECRET_KEY
        generateValue: true

      - key: AUTH_ACCESS_TOKEN_MINUTES
        value: "60"

      - key: CORS_ALLOWED_ORIGINS
        sync: false

      - key: GOOGLE_API_KEY
        sync: false

databases:
  - name: nestora-postgres
    plan: free
    databaseName: nestora
    user: nestora
